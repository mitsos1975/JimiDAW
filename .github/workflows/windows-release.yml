name: Windows release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Collect the program
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse build -Filter JimiDAW.exe | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          if (-not $exe) { throw 'JimiDAW.exe was not produced' }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $exe.FullName dist/JimiDAW.exe
          Compress-Archive -Path dist/JimiDAW.exe -DestinationPath JimiDAW-Windows.zip -Force

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build the installer
        shell: pwsh
        run: |
          $version = "0.3.${{ github.run_number }}"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" installer\JimiDAW.iss
          Get-ChildItem dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.${{ github.run_number }}
          name: JimiDAW 0.3.${{ github.run_number }} for Windows
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            Download JimiDAW-Setup-0.3.${{ github.run_number }}.exe and run it.
            It installs JimiDAW and puts a shortcut on the desktop.

            JimiDAW-Windows.zip is the same program without an installer.

            Pick the input and output with the Audio button.
            If Windows reports a missing DLL, install the Microsoft Visual C++ 2015-2022 redistributable (x64).
          files: |
            JimiDAW-Windows.zip
            dist/JimiDAW-Setup-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
